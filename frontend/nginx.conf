server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # SPA routing — every unknown path falls through to index.html.
  location / {
    try_files $uri /index.html;
  }

  # Reverse-proxy API calls to the FastAPI backend on the same compose network.
  location /api/ {
    proxy_pass http://backend:8000/api/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_read_timeout 300s;
  }
}
