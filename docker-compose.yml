# One-command run for the whole stack:
#
#   docker compose up --build
#
# Three services on a shared network:
#   backend  - FastAPI server  (port 8000)
#   agent    - LiveKit voice agent worker (no exposed port; talks to LiveKit Cloud)
#   frontend - nginx serving the built React app + reverse-proxy to backend (port 5173)
#
# `data/` is bind-mounted into both Python services so the vector store and
# the system-prompt state file are shared.

services:
  backend:
    build: ./backend
    env_file: ./backend/.env
    ports:
      - "8000:8000"
    volumes:
      - ./backend/data:/app/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5

  agent:
    build: ./backend
    env_file: ./backend/.env
    command: ["python", "-m", "app.agent.voice_agent", "start"]
    volumes:
      - ./backend/data:/app/data
    depends_on:
      backend:
        condition: service_healthy

  frontend:
    build: ./frontend
    ports:
      - "5173:80"
    depends_on:
      - backend
